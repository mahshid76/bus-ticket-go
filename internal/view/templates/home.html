<!DOCTYPE html>
<html>
<head>
  <title>Bus Tickets</title>
  <style>
    body { font-family: Arial; background: #f6f7f9; }
    .card { max-width: 520px; margin: 80px auto; padding: 24px; background: white; border-radius: 8px; }
    select, input, button { width: 100%; padding: 10px; margin-top: 12px; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>

<div class="card">
  <h2>Search Bus Tickets</h2>

  <form method="get" action="/search">
    <label>From</label>
    <select name="fromCity">
      {{ range .Cities }}
        <option value="{{ .ID }}">{{ .Name }}</option>
      {{ end }}
    </select>

    <label>To</label>
    <select name="toCity">
      {{ range .Cities }}
        <option value="{{ .ID }}">{{ .Name }}</option>
      {{ end }}
    </select>

    <label>Date</label>
    <input type="date" name="date" required />

    <button type="submit">Search</button>
  </form>
</div>

</body>
</html>
