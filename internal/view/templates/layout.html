{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{.Title}}</title>
<meta name="description" content="Busscanner finds bus trips between European cities and links you to the operator to book.">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="band"><div class="wrap">
  <header class="site">
    <a class="logo" href="/"><i>B</i>Busscanner</a>
    <nav><a class="pill-btn" href="/#search">New search</a></nav>
  </header>
  {{template "hero" .}}
</div></div>
<main class="wrap">{{template "content" .}}</main>
<footer>© 2026 Busscanner · Timetables from the public FlixBus GTFS feed · You book on the operator's site</footer>
<script src="/static/app.js" defer></script>
</body>
</html>{{end}}
{{define "hero"}}{{end}}
